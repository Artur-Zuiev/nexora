name: Local database backup and restore test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  disposable-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start disposable local PostgreSQL
        run: docker compose up -d --wait
      - name: Wait for stable PostgreSQL startup and seed synthetic data
        run: |
          # The official Postgres image uses a temporary server during first-time init.
          # Require real SQL success over multiple checks, then retry the seed.
          stable=0
          for i in $(seq 1 90); do
            if docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U nexora -d nexora -tAc "SELECT 1" >/dev/null 2>&1; then
              stable=$((stable + 1))
              if [ "$stable" -ge 3 ]; then break; fi
            else
              stable=0
            fi
            sleep 2
          done
          if [ "$stable" -lt 3 ]; then docker compose logs postgres; exit 1; fi
          seeded=0
          for i in $(seq 1 30); do
            if docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U nexora -d nexora -c \
              "CREATE TABLE backup_smoke (id integer PRIMARY KEY, label text NOT NULL); INSERT INTO backup_smoke VALUES (1, 'synthetic-only');"; then
              seeded=1
              break
            fi
            sleep 2
          done
          test "$seeded" = "1"
      - name: Run backup and verify
        run: |
          python scripts/db_backup.py backup --output /tmp/nexora-ci-smoke.dump
          python scripts/db_backup.py verify --input /tmp/nexora-ci-smoke.dump
      - name: Ensure restore cannot modify existing database
        run: |
          if python scripts/db_backup.py restore --input /tmp/nexora-ci-smoke.dump --database nexora --confirm RESTORE:nexora; then exit 1; fi
          if python scripts/db_backup.py restore --input /tmp/nexora-ci-smoke.dump --database e2e_restored --confirm WRONG; then exit 1; fi
      - name: Restore to a newly created disposable database
        run: |
          python scripts/db_backup.py restore --input /tmp/nexora-ci-smoke.dump --database e2e_restored --confirm RESTORE:e2e_restored
          restored=$(docker compose exec -T postgres psql -U nexora -d e2e_restored -tAc "SELECT label FROM backup_smoke WHERE id=1")
          test "$restored" = "synthetic-only"
          original=$(docker compose exec -T postgres psql -U nexora -d nexora -tAc "SELECT count(*) FROM backup_smoke")
          test "$original" = "1"
          if python scripts/db_backup.py restore --input /tmp/nexora-ci-smoke.dump --database e2e_restored --confirm RESTORE:e2e_restored; then exit 1; fi
      - name: Refuse checksum tampering
        run: |
          echo '0' > /tmp/nexora-ci-smoke.dump.sha256
          if python scripts/db_backup.py verify --input /tmp/nexora-ci-smoke.dump; then exit 1; fi
      - name: Cleanup temporary database and backup
        if: always()
        run: |
          rm -f /tmp/nexora-ci-smoke.dump /tmp/nexora-ci-smoke.dump.sha256
          docker compose down -v
