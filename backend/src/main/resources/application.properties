spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexora}
spring.datasource.username=${DB_USER:nexora}
spring.datasource.password=${DB_PASSWORD:local_dev_only}
# Flyway owns DDL; Hibernate only checks the resulting schema.
spring.jpa.hibernate.ddl-auto=validate
# Existing LOCAL development databases are baselined at version 1.
# Disable and replace this for production migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.port=8080

# Prevent accidental LAN exposure during local prototype development.
server.address=127.0.0.1

# Local-only session defaults; HTTPS/secure cookies required for remote deployment.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
